<title>Pixie Lab Kiosk</title>

<style>
/* Pixie Nail Lab brand ("nail бабочка"): forest + sage + cream, butterfly mark, Tenor Sans / Newsreader / Inter.
   Layout: one-screen tablet app — top bar with wordmark, swappable view, forest welcome veil with the butterfly.
   Deliberately single-theme so every station looks identical. */
:root{
  --forest:#444836;
  --olive:#777A65;
  --sage:#A7AC8C;
  --cream:#F7ECDD;
  --paper:#FCF7EF;
  --line:#E4D9C6;
  --sage-wash:#E9E6D6;
  --label:"Tenor Sans", "Gill Sans", "Avenir Next", sans-serif;
  --serif:"Newsreader", "Iowan Old Style", Georgia, serif;
  --body:"Inter", -apple-system, system-ui, sans-serif;
  --r:16px;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--cream);color:var(--forest);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--olive);outline-offset:3px}
a{color:inherit}
.app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:18px;padding-block:16px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--cream)}
.wmhit{padding:10px 8px;margin:-10px -8px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:default}
.wordmark{display:block;height:22px;width:auto;pointer-events:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.station{font-family:var(--label);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--olive);padding:6px 12px;border:1px solid var(--line);border-radius:99px;white-space:nowrap}
.bar .spacer{flex:1}
.clock{font-variant-numeric:tabular-nums;color:var(--olive);font-size:15px}
.homebtn{display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:99px;background:var(--forest);color:var(--cream);font-family:var(--label);letter-spacing:.12em;text-transform:uppercase;font-size:13px}
.view{flex:1;overflow-y:auto;padding-block:30px 44px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:clamp(36px,4.6vw,54px);line-height:1.05}
h2{font-size:clamp(30px,3.4vw,40px);line-height:1.1}
h1 em,h2 em{font-style:italic;color:var(--olive)}
.lede{color:var(--olive);margin:10px 0 0;max-width:60ch;line-height:1.55}
.eyebrow{font-family:var(--label);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--olive);margin-bottom:8px}
.sub{font-family:var(--label);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--olive)}

/* home grid */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:28px;min-height:176px;padding:22px;border-radius:var(--r);background:var(--paper);border:1px solid var(--line);text-align:left;transition:transform .15s ease}
.tile:active{transform:scale(.98)}
.tile .ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--sage-wash);color:var(--forest)}
.tile .ico svg{width:22px;height:22px}
.tile b{display:block;font-family:var(--serif);font-weight:400;font-size:23px;line-height:1.15;margin-bottom:6px}
.tile span{color:var(--olive);font-size:14px;line-height:1.45}
.tile.locked{opacity:.45;cursor:default}
.tile.locked span{font-family:var(--label);letter-spacing:.16em;text-transform:uppercase;font-size:11px}
.tile.hero{background:var(--forest);color:var(--cream);border-color:var(--forest)}
.tile.hero span{color:var(--sage)}
.tile.hero .ico{background:rgba(247,236,221,.12);color:var(--cream)}

/* shared */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.stack{display:flex;flex-direction:column;gap:18px}
.group{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:12px 18px;border-radius:99px;border:1px solid var(--line);background:var(--paper);font-weight:500}
.chip[aria-pressed="true"]{background:var(--forest);color:var(--cream);border-color:var(--forest)}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.opt{display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:14px;border:1px solid var(--line);background:var(--paper);text-align:left}
.opt b{font-family:var(--serif);font-weight:400;font-size:21px}
.opt small{color:var(--olive);font-size:14px}
.cta{align-self:flex-start;padding:17px 30px;border-radius:99px;background:var(--forest);color:var(--cream);font-family:var(--label);letter-spacing:.14em;text-transform:uppercase;font-size:14px}
.cta:disabled{opacity:.3}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}

/* signature drinks */
.sig{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sigd{display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:14px;border:1px solid var(--line);background:var(--paper);text-align:left}
.sigd b{font-family:var(--serif);font-style:italic;font-weight:400;font-size:24px}
.sigd small{color:var(--olive);font-size:12px;letter-spacing:.06em}
.sigd span{font-size:14px;line-height:1.45;color:var(--forest)}
.sigd[aria-pressed="true"]{background:var(--forest);color:var(--cream);border-color:var(--forest)}
.sigd[aria-pressed="true"] small,.sigd[aria-pressed="true"] span{color:var(--sage)}
.age{display:inline-block;margin-left:8px;font-family:var(--label);font-style:normal;font-size:10px;letter-spacing:.12em;padding:2px 7px;border-radius:99px;border:1px solid currentColor;vertical-align:middle}

/* price menu */
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.menu h3{font-size:26px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row div{min-width:0}
.row small{display:block;color:var(--olive);font-size:13px;margin-top:2px}
.row .p{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}

/* colors */
.swatches{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.sw{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:14px;border:1px solid var(--line);background:var(--paper)}
.sw .nail{width:38px;height:56px;border-radius:19px 19px 10px 10px;box-shadow:inset -6px -8px 12px rgba(0,0,0,.12), inset 5px 6px 8px rgba(255,255,255,.35)}
.sw small{font-size:12px;color:var(--olive);text-align:center}
.sw[aria-pressed="true"]{border-color:var(--forest);box-shadow:0 0 0 2px var(--forest) inset}

/* entertainment */
.apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.app-tile{text-align:left;display:flex;flex-direction:column;gap:14px;padding:24px;border-radius:var(--r);text-decoration:none;min-height:150px;justify-content:space-between}
.app-tile b{font-size:22px}
.app-tile span{font-size:14px;opacity:.8}
.nf{background:#141414;color:#fff}.nf b{color:#E50914;letter-spacing:.04em}
.yt{background:#fff;color:#0F0F0F;border:1px solid var(--line)}.yt b{color:#FF0033}
.hu{background:#0B0C0F;color:#fff}.hu b{color:#1CE783;font-size:26px;letter-spacing:-.01em}
.hb{background:#002BE7;color:#fff}.hb b{color:#fff}
.apps{grid-template-columns:repeat(4,minmax(0,1fr))!important}
@media (max-width:900px){.apps{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
.note{font-size:14px;color:var(--olive);line-height:1.5;margin:0}

/* qr */
.qrs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.qr{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.qr b{font-family:var(--serif);font-weight:400;font-size:20px}
.qr .code{background:#fff;padding:12px;border-radius:12px;border:1px solid var(--line)}
.qr .code{min-width:158px;min-height:158px;max-width:158px;overflow:hidden;overflow-wrap:anywhere;font-size:11px;color:var(--olive)}
.qr .code img,.qr .code canvas{display:block;width:132px!important;height:132px!important}
.tag{font-family:var(--label);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border-radius:99px;background:var(--sage-wash);color:var(--olive)}

.folder{width:min(300px,100%);aspect-ratio:3/4.1;background:var(--paper);border-radius:6px;box-shadow:0 18px 40px rgba(20,22,14,.35);display:flex;flex-direction:column;overflow:hidden;transform:rotate(-2deg)}
.ftop{flex:1.15;display:grid;place-items:center;border-bottom:1px solid var(--line)}
.ftop span{font-family:var(--serif);font-style:italic;font-size:28px;color:var(--forest)}
.fband{height:9%;border-bottom:1px solid var(--line);background:linear-gradient(var(--paper),var(--cream))}
.fpocket{flex:1;display:grid;place-items:center;padding:14px;background:var(--cream)}
.mini{position:relative;width:88%;aspect-ratio:1.6;border-radius:12px;background:var(--forest);overflow:hidden;display:grid;place-items:center;box-shadow:0 6px 14px rgba(20,22,14,.25)}
.minibf{position:absolute;width:62%;opacity:.5;top:-8%}
.miniwm{position:relative;width:78%;margin-top:34%}
.giftqr{display:flex;gap:16px;align-items:center}
.giftqr .code{background:#fff;padding:12px;border-radius:12px;border:1px solid var(--line);min-width:180px;min-height:180px;max-width:180px;overflow:hidden;overflow-wrap:anywhere;font-size:10px}
.giftqr .code img,.giftqr .code canvas{display:block;width:156px!important;height:156px!important}
.giftqr b{display:block;font-family:var(--serif);font-weight:400;font-size:20px}
@media (max-width:900px){.giftwrap{grid-template-columns:minmax(0,1fr)}.giftscene{min-height:380px}}
/* in-kiosk booking window */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(68,72,54,.55)}
.sheet .box{width:min(980px,100%);height:100%;max-height:900px;display:flex;flex-direction:column;background:var(--paper);border-radius:var(--r);overflow:hidden;box-shadow:0 24px 60px rgba(20,22,14,.35)}
.sheet .shead{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--forest);color:var(--cream)}
.sheet .shead img{height:16px;width:auto}
.sheet .shead span{flex:1;font-family:var(--label);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--sage)}
.sheet .sclose{padding:10px 18px;border-radius:99px;background:var(--cream);color:var(--forest);font-family:var(--label);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.sheet iframe{flex:1;width:100%;border:0;background:#fff}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--forest);color:var(--cream);padding:16px 24px;border-radius:16px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);transition:all .25s ease;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast img{width:22px;height:auto;flex:none}

.veil .tap{font-family:var(--label);font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--cream);padding:16px 32px;border:1px solid rgba(247,236,221,.6);border-radius:99px;animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
@keyframes flutter{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.9) translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.veil .tap,.veil .bf{animation:none}.toast,.tile{transition:none}}

.demo{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));font-family:var(--label);font-size:10px;color:var(--olive);letter-spacing:.14em;text-transform:uppercase;z-index:25}

select{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--forest)}
.settings{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

@media (max-width:900px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .swatches{grid-template-columns:repeat(4,minmax(0,1fr))}
  .qrs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two,.menu{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .opts,.apps,.sig{grid-template-columns:minmax(0,1fr)}
  .swatches{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tile{min-height:140px}
  .clock,.station{display:none}
  .wordmark{height:18px}
}
</style>

function saveStation(){try{localStorage.setItem('pixie-station',JSON.stringify(station))}catch(e){} $('#stationLabel').textContent=station.loc+' · '+seatWord()+' '+station.num;}

function tick(){$('#clock').textContent=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});}

/* Requests go to n8n → Rosie → the admin phone of this tablet's location. */
const HOOK='https://pixienaillab.app.n8n.cloud/webhook/pixie-kiosk';
let cur='home';
function sent(what,kind){
  kind=kind||({desk:'desk',book:'book',shop:'shop',colors:'shade',drinks:'drink'})[cur]||'desk';
  const body=new URLSearchParams({k:'pnl26',loc:station.loc,st:String(station.num),kind,text:what});
  toast('Sending…');
  fetch(HOOK,{method:'POST',mode:'no-cors',body})
    .then(()=>toast('Sent! The front desk is on it.'))
    .catch(()=>toast('We couldn\'t reach the front desk. Please wave to our team — we\'ll be right there.'));
}

       <div class="group"><div class="sub">Milk</div><div class="chips">${MILK.map(m=>`<button class="chip" data-milk="${m}" aria-pressed="${m==='No milk'}">${m}</button>`).join('')}</div></div>
       <div class="group"><div class="sub">Sweetness</div><div class="chips">${['None','A little','Sweet'].map(m=>`<button class="chip" data-sweet="${m}" aria-pressed="${m==='None'}">${m}</button>`).join('')}</div></div>
       </div>
       <button class="cta" id="orderDrink" disabled>Choose a drink</button>
     </div>
   </div>
 </div>`;

S.book=()=>{
 const L=LOC[station.loc];
 return `
 <div class="wrap">
   <div><div class="eyebrow">Next visit · ${station.loc}</div><h2>Book <em>before you go.</em></h2><p class="lede">Most clients come back every 3–4 weeks. Pick your master, day and time in our booking — right here or on your phone.</p></div>
   <div class="two">
     <div class="panel stack">
       <div class="group"><div class="sub">Pixie Nail Lab ${station.loc}</div><div>${L.addr}<br><span style="color:var(--olive)">${L.phone} · open daily 9 am – 6 pm</span></div></div>
       <button class="cta" data-sheet="book">Book on this iPad</button>
       <button class="chip" data-send="Please book my next visit" style="align-self:flex-start">Ask the front desk to book for me</button>
     </div>
     <div class="panel qr"><div class="code" data-url="${L.book}"></div><b>Book on your phone</b><span class="tag">Scan with your camera</span></div>
   </div>
 </div>`;};

S.menu=()=>`
 <div class="wrap">
   <div><div class="eyebrow">Menu</div><h2>Services <em>&amp; prices</em></h2><p class="lede">Prices vary by master level. Ask the front desk for anything you don't see here.</p></div>
   <div class="menu">${MENU.map(g=>`<div class="panel"><h3>${g.cat}</h3>${g.rows.map(r=>`<div class="row"><div>${r[0]}${r[1]?`<small>${r[1]}</small>`:''}</div><div class="p">${r[2]}</div></div>`).join('')}</div>`).join('')}</div>
   <p class="note">Nail art is added to a gel manicure or pedicure, not over regular polish. A 5% processing and administration fee applies to all services.</p>
 </div>`;

S.colors=()=>`
 <div class="wrap">
   <div><div class="eyebrow">Color library</div><h2>Find your <em>next shade.</em></h2><p class="lede">Tap up to three shades to send to your master. Sample palette — your gel collection goes here.</p></div>
   <div class="swatches">${SHADES.map(([c,n])=>`<button class="sw" data-shade="${n}" aria-pressed="false"><span class="nail" style="background:${c}"></span><small>${n}</small></button>`).join('')}</div>
   <button class="cta" id="shadeBtn" disabled>Pick up to 3 shades</button>
 </div>`;

S.watch=()=>`
 <div class="wrap">
   <div><div class="eyebrow">Relax</div><h2>Watch <em>&amp; listen.</em></h2><p class="lede">Headphones are at your station and fresh ear covers are on the tray. Swipe up from the bottom to come back to this menu.</p></div>
   <div class="apps">
     <button class="app-tile nf" data-app="netflix"><b>NETFLIX</b><span>Series & films</span></button>
     <button class="app-tile yt" data-app="youtube"><b>YouTube</b><span>Videos & music</span></button>
     <button class="app-tile hu" data-app="hulu"><b>hulu</b><span>Series & films</span></button>
     <button class="app-tile hb" data-app="hbomax"><b>HBO Max</b><span>Series & films</span></button>
   </div>
   <p class="note">On the salon iPads these tiles open the installed apps, already signed in to the salon's profile.</p>
 </div>`;

S.review=()=>`
 <div class="wrap">
   <div><div class="eyebrow">Thank you</div><h2>Loved <em>your visit?</em></h2><p class="lede">Scan with your phone. A few words help other clients find us and make our masters' day.</p></div>
   <div class="panel"><div class="qrs" style="grid-template-columns:repeat(2,minmax(0,1fr));max-width:520px;margin:0 auto">
     ${LOC[station.loc].google?qr('q1','Google',LOC[station.loc].google,station.loc):soon('Google')}
     ${LOC[station.loc].yelp?qr('q2','Yelp',LOC[station.loc].yelp,station.loc):soon('Yelp')}
   </div></div>
 </div>`;
function soon(t){return `<div class="qr"><div class="code" style="width:158px;height:158px;display:grid;place-items:center;color:var(--olive);font-size:13px">Link coming soon</div><b>${t}</b><span class="tag">${station.loc}</span></div>`}
function qr(id,t,url,tag){return `<div class="qr"><div class="code" id="${id}" data-url="${url}"></div><b>${t}</b><span class="tag">${tag}</span></div>`}

const GIFT='https://www.pixienaillab.com/s/gift-cards';

S.admin=()=>`
 <div class="wrap">
   <div><div class="eyebrow">Staff only</div><h2>Tablet <em>settings</em></h2><p class="lede">Set once per iPad. Requests from this tablet will say where the client is sitting.</p></div>
   <div class="panel settings">
     <label for="sLoc">Location</label>
     <select id="sLoc">${['Kirkland','Seattle'].map(l=>`<option ${l===station.loc?'selected':''}>${l}</option>`).join('')}</select>
     <label for="sNum">Station / iPad #</label>
     <select id="sNum">${Array.from({length:12},(_,i)=>i+1).map(n=>`<option ${n==station.num?'selected':''}>${n}</option>`).join('')}</select>
   </div>
 </div>`;

function go(name){
  cur=name;
  view.innerHTML=S[name](); view.scrollTop=0;
  homeBtn.hidden=(name==='home');
  if(name==='review'||name==='shop'||name==='book') drawQRs();
  if(name==='admin'){
    $('#sLoc').onchange=e=>{station.loc=e.target.value;saveStation();};
    /* 'drinks' and 'book' read the station at render time */
    $('#sNum').onchange=e=>{station.num=+e.target.value;saveStation();};
  }
}
function drawQRs(){
  document.querySelectorAll('.code[data-url]').forEach(el=>{
    if(window.QRCode){ try{ new QRCode(el,{text:el.dataset.url,width:264,height:264,colorDark:'#444836',colorLight:'#FFFFFF',correctLevel:QRCode.CorrectLevel.M}); }catch(e){ el.textContent=el.dataset.url; } }
    else el.textContent=el.dataset.url;
  });
}
homeBtn.onclick=()=>go('home');
function openSheet(url,title){$('#sheetTitle').textContent=title;$('#sheetFrame').src=url;$('#sheet').hidden=false;}
function closeSheet(){$('#sheet').hidden=true;$('#sheetFrame').src='about:blank';}
$('#sheetClose').onclick=closeSheet;
/* Open the installed streaming app by its app link; try the next one if the iPad is still showing us. */
const APPS={netflix:['nflx://'],youtube:['youtube://'],hulu:['hulu://'],hbomax:['shortcuts://run-shortcut?name=Open%20HBO%20Max'] /* iPad Shortcut 'Open HBO Max' → Open App: HBO Max */};
function openApp(key){
  const list=APPS[key].slice();
  (function next(){
    const u=list.shift(); if(!u){toast('Please ask the front desk to open this app for you.');return;}
    location.href=u;
    setTimeout(()=>{ if(!document.hidden) next(); },1500);
  })();
}

const blank=()=>({drink:null,snacks:[],temp:'Hot',milk:'No milk',sweet:'None',bsvc:'Same as today',bday:null,btime:null,shades:[]});
let pick=blank();
function press(group,btn){document.querySelectorAll(`[data-${group}]`).forEach(b=>b.setAttribute('aria-pressed',b===btn?'true':'false'));}
view.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.go) return go(b.dataset.go);
  if(b.dataset.app) return openApp(b.dataset.app);
  if(b.dataset.sheet==='book') return openSheet(LOC[station.loc].book,'Book your next visit · '+station.loc);
  if(b.dataset.send){ sent(b.dataset.send); return; }
  if(b.dataset.drink){pick.drink=b.dataset.drink;press('drink',b);const c=$('#coffeeOpts');c.hidden=!isCoffee(pick.drink);if(c.hidden){pick.temp='Hot';pick.milk='No milk';pick.sweet='None';}updOrder();return;}
  if(b.dataset.snack){const s=b.dataset.snack,i=pick.snacks.indexOf(s);if(i>=0){pick.snacks.splice(i,1);b.setAttribute('aria-pressed','false');}else{pick.snacks.push(s);b.setAttribute('aria-pressed','true');}updOrder();return;}
  if(b.dataset.temp){pick.temp=b.dataset.temp;press('temp',b);return;}
  if(b.dataset.milk){pick.milk=b.dataset.milk;press('milk',b);return;}
  if(b.dataset.sweet){pick.sweet=b.dataset.sweet;press('sweet',b);return;}
  if(b.id==='orderDrink'){const parts=[];if(pick.drink)parts.push(isCoffee(pick.drink)?[pick.temp,pick.drink.toLowerCase()].join(' ')+(pick.milk!=='No milk'?' with '+pick.milk.toLowerCase():'')+(pick.sweet!=='None'?', '+pick.sweet.toLowerCase()+' sweet':''):pick.drink);if(pick.snacks.length)parts.push(pick.snacks.join(', ').toLowerCase());sent(parts.join(' + '),'drink');pick.snacks=[];setTimeout(()=>go('home'),900);return;}
  if(b.dataset.bsvc){pick.bsvc=b.dataset.bsvc;press('bsvc',b);return;}
  if(b.dataset.bday){pick.bday=b.dataset.bday;press('bday',b);updBook();return;}
  if(b.dataset.btime){pick.btime=b.dataset.btime;press('btime',b);updBook();return;}
  if(b.id==='bookBtn'){sent('Booking request','book');setTimeout(()=>go('home'),900);return;}
  if(b.dataset.shade){
    const n=b.dataset.shade,i=pick.shades.indexOf(n);
    if(i>=0){pick.shades.splice(i,1);b.setAttribute('aria-pressed','false');}
    else if(pick.shades.length<3){pick.shades.push(n);b.setAttribute('aria-pressed','true');}
    const s=$('#shadeBtn');s.disabled=!pick.shades.length;s.textContent=pick.shades.length?'Send '+pick.shades.join(', ')+' to my master':'Pick up to 3 shades';return;
  }
  if(b.id==='shadeBtn'){sent('Shades: '+pick.shades.join(', '),'shade');return;}
});
const COFFEE=new Set([...DRINKS[0][1],'Maple Cinnamon Latte']);
function isCoffee(d){return COFFEE.has(d);}
function updOrder(){const o=$('#orderDrink');const n=(pick.drink?1:0)+pick.snacks.length;o.disabled=!n;o.textContent=!n?'Choose a drink':'Order '+(pick.drink||'snacks')+(pick.drink&&pick.snacks.length?' + snacks':'');}
function updBook(){const b=$('#bookBtn');if(pick.bday&&pick.btime){b.disabled=false;b.textContent='Request '+new Date(pick.bday).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+', '+pick.btime.toLowerCase();}}

/* staff settings: hold the wordmark 2 s, or tap it 5 times quickly */
let lp,taps=0,tapT;const wm=$('#wordmark');
function openAdmin(){clearTimeout(lp);taps=0;veil.hidden=true;go('admin');}
function down(e){clearTimeout(lp);lp=setTimeout(openAdmin,2000);}
function up(){clearTimeout(lp);taps++;clearTimeout(tapT);tapT=setTimeout(()=>taps=0,1500);if(taps>=5)openAdmin();}
wm.addEventListener('touchstart',e=>{e.preventDefault();down();},{passive:false});
wm.addEventListener('touchend',e=>{e.preventDefault();up();},{passive:false});
wm.addEventListener('touchcancel',()=>clearTimeout(lp));
wm.addEventListener('mousedown',down);wm.addEventListener('mouseup',up);
wm.addEventListener('contextmenu',e=>e.preventDefault());

/* welcome + 30-minute idle reset */
let idle;
function resetIdle(){clearTimeout(idle);idle=setTimeout(()=>{closeSheet();veil.hidden=false;pick=blank();go('home');},1800000);}
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,resetIdle,{passive:true}));
$('#start').onclick=()=>{veil.hidden=true;resetIdle();};
veil.addEventListener('click',e=>{if(e.target===veil){veil.hidden=true;resetIdle();}});

go('home');
})();
</script>
